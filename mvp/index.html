<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EKLOR</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>Forum des Commentaires</h1>
    <p><em>Entrez un commentaire ci-dessous :</em></p>
    <form id="commentForm">
        <input type="text" id="username" placeholder="Votre pseudo" required>
        <textarea id="message" placeholder="Votre commentaire" required></textarea>
        <button type="submit" id="submit">Publier</button>
    </form>


    <h2>Commentaires</h2>
    <ul id="commentsList"></ul>

    <script src="./scripts.js"></script>
</body>
</html>
